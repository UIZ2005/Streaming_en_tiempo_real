[agent]
  interval = "1s"
  flush_interval = "1s"
  metric_batch_size = 5000
  metric_buffer_limit = 200000

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "uao"
  bucket = "finanzas"

# ============ transacciones ============
[[inputs.kafka_consumer]]
  brokers = ["kafka:9092"]
  topics = ["eventos-validos"]
  consumer_group = "telegraf-transacciones"
  offset = "newest"
  data_format = "json_v2"
  [[inputs.kafka_consumer.json_v2]]
    measurement_name = "transacciones"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "tipo"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "ciudad"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "categoria"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "monto"
      type = "float"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "exito"
      type = "bool"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "ts_evento"
      type = "int"
    [[inputs.kafka_consumer.json_v2.field]]
      path = "event_id"
      type = "string"

# ============ agregados_minuto ============
[[inputs.kafka_consumer]]
  brokers = ["kafka:9092"]
  topics = ["agregados-minuto"]
  consumer_group = "telegraf-agregados"
  offset = "newest"
  data_format = "json_v2"
  [[inputs.kafka_consumer.json_v2]]
    measurement_name = "agregados_minuto"
    timestamp_path = "ventana_inicio"
    timestamp_format = "unix_ms"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "dimension"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "valor"
    [[inputs.kafka_consumer.json_v2.field]]
      path = "conteo"
      type = "int"
    [[inputs.kafka_consumer.json_v2.field]]
      path = "monto_promedio"
      type = "float"
    [[inputs.kafka_consumer.json_v2.field]]
      path = "monto_maximo"
      type = "float"
    [[inputs.kafka_consumer.json_v2.field]]
      path = "monto_total"
      type = "float"

# ============ alertas ============
[[inputs.kafka_consumer]]
  brokers = ["kafka:9092"]
  topics = ["alertas-fraude"]
  consumer_group = "telegraf-alertas"
  offset = "newest"
  data_format = "json_v2"
  [[inputs.kafka_consumer.json_v2]]
    measurement_name = "alertas"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "tipo_alerta"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "tipo_evento"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "ciudad"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "clave"
      type = "string"
    [[inputs.kafka_consumer.json_v2.field]]
      path = "monto"
      type = "float"
      optional = true
    [[inputs.kafka_consumer.json_v2.field]]
      path = "detalle"
      type = "string"
    [[inputs.kafka_consumer.json_v2.field]]
      path = "event_id"
      type = "string"
    [[inputs.kafka_consumer.json_v2.field]]
      path = "ts_evento"
      type = "int"
    [[inputs.kafka_consumer.json_v2.field]]
      path = "ts_alerta"
      type = "int"

# ============ dlq ============
[[inputs.kafka_consumer]]
  brokers = ["kafka:9092"]
  topics = ["dlq"]
  consumer_group = "telegraf-dlq"
  offset = "newest"
  data_format = "json_v2"
  [[inputs.kafka_consumer.json_v2]]
    measurement_name = "dlq"
    [[inputs.kafka_consumer.json_v2.field]]
      path = "error"
      type = "string"
    [[inputs.kafka_consumer.json_v2.field]]
      path = "mensaje"
      type = "string"
    [[inputs.kafka_consumer.json_v2.field]]
      path = "ts_error"
      type = "int"