services:
  kafka:
    image: apache/kafka:3.8.0
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      retries: 10
      start_period: 15s

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka: { condition: service_healthy }
    volumes: ["./kafka/crear-topics.sh:/crear-topics.sh"]
    entrypoint: ["sh", "/crear-topics.sh"]
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: finanzas
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka: { condition: service_healthy }

  productor-tarjetas:
    build: ./productores
    command: python productor_tarjetas.py
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TASA: ${TASA_TARJETAS:-200}
      P_FRAUDE: ${P_FRAUDE_TARJETAS:-0.01}
      P_MALFORMADO: ${P_MALFORMADO:-0.01}
    depends_on:
      kafka-init: { condition: service_completed_successfully }
    mem_limit: 256m
    restart: unless-stopped

  productor-transferencias:
    build: ./productores
    command: python productor_transferencias.py
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TASA: ${TASA_TRANSFERENCIAS:-200}
      P_FRAUDE: ${P_FRAUDE_TRANSFERENCIAS:-0.02}
      P_MALFORMADO: ${P_MALFORMADO:-0.01}
    depends_on:
      kafka-init: { condition: service_completed_successfully }
    mem_limit: 256m
    restart: unless-stopped

  productor-logins:
    build: ./productores
    command: python productor_logins.py
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TASA: ${TASA_LOGINS:-200}
      P_FRAUDE: ${P_FRAUDE_LOGINS:-0.005}
      P_MALFORMADO: ${P_MALFORMADO:-0.01}
    depends_on:
      kafka-init: { condition: service_completed_successfully }
    mem_limit: 256m
    restart: unless-stopped